<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Jobko - Job Finder Mobile App</title>
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover">
  <!-- font -->
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="../css/nouislider.min.css" />
  <link rel="stylesheet" href="../css/swiper-bundle.min.css">
  <link rel="stylesheet" type="text/css" href="../css/styles.css" />
  <!-- manifest json -->
  <link rel="manifest" href="../_manifest.json" data-pwa-version="set_in_manifest_and_pwa_js">
  <!-- Favicon and Touch Icons  -->
  <link rel="shortcut icon" href="../images/logo/168.png" />
  <link rel="apple-touch-icon-precomposed" href="../images/logo/168.png" />

</head>

<body>

  <header class="header-main">
    <button class="btn-left btn_back">
      <svg class="icon-back">
        <use href="../icon/sprite.svg#back"></use>
      </svg>
    </button>
    <h2 class="title">KYC Verification</h2>
    <button class="btn-right" type="button">
      <svg class="icon-more-vertical">
        <use href="../icon/sprite.svg#more-vertical"></use>
      </svg>
    </button>
  </header>

  <div class="page-width spacing_top-2 spacing_bottom-2">
    <div class="kyc-card">
      <div class="order-summary">
        <div class="totals">
          <div class="row">
            <span>Document Type :</span>
            <span>Password</span>
          </div>
          <div class="row">
            <span>Document No. :</span>
            <span>A41004511</span>
          </div>
          <div class="row">
            <span>Issue Date :</span>
            <span>12 March, 2023</span>
          </div>
          <div class="row">
            <span>Expire Date :</span>
            <span>13 March, 2033</span>
          </div>
          <div class="row">
            <span>Status :</span>
            <span class="badge-status approved">Approved</span>
          </div>
        </div>
      </div>
    </div>

    <div class="row-grid column-2 kyc-actions">
      <a href="add-kyc.html" class="btn-line">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M9.91659 2.33334C10.0918 2.15819 10.2999 2.0195 10.5312 1.92401C10.7625 1.82851 11.0107 1.77921 11.2611 1.77921C11.5116 1.77921 11.7598 1.82851 11.9911 1.92401C12.2224 2.0195 12.4305 2.15819 12.6057 2.33334C12.7808 2.5085 12.9195 2.71662 13.015 2.94793C13.1105 3.17924 13.1598 3.42741 13.1598 3.67792C13.1598 3.92843 13.1105 4.17661 13.015 4.40792C12.9195 4.63922 12.7808 4.84735 12.6057 5.02251L4.55817 13.0701L1.44409 13.8892L2.26318 10.7751L9.91659 2.33334Z"
            stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Edit
      </a>
      <a href="#" class="btn-dark">
        <svg class="icon-eye">
          <use href="../icon/sprite.svg#eye"></use>
        </svg>
        View
      </a>
    </div>
  </div>

  <script type="text/javascript" src="../js/bootstrap.min.js"></script>
  <script type="text/javascript" src="../js/jquery.min.js"></script>
  <script type="text/javascript" src="../js/lazysize.min.js"></script>
  <script type="text/javascript" src="../js/swiper-bundle.min.js"></script>
  <script type="text/javascript" src="../js/carousel.js"></script>
  <script type="text/javascript" src="../js/jquery.nice-select.min.js"></script>
  <script type="text/javascript" src="../js/count-down.js"></script>
  <script type="text/javascript" src="../js/multiple-modal.js"></script>
  <script type="text/javascript" src="../js/nouislider.min.js"></script>
  <script type="text/javascript" src="../js/rangle-slider.js"></script>
  <script type="text/javascript" src="../js/init.js"></script>
  <script type="text/javascript" src="../js/main.js"></script>

</body>

</html>
