<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Jobko - Job Finder Mobile App</title>
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover">
  <!-- font -->
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="../css/nouislider.min.css" />
  <link rel="stylesheet" href="../css/swiper-bundle.min.css">
  <link rel="stylesheet" type="text/css" href="../css/styles.css" />
  <!-- manifest json -->
  <link rel="manifest" href="../_manifest.json" data-pwa-version="set_in_manifest_and_pwa_js">
  <!-- Favicon and Touch Icons  -->
  <link rel="shortcut icon" href="../images/logo/168.png" />
  <link rel="apple-touch-icon-precomposed" href="../images/logo/168.png" />

</head>

<body>

  <header class="header-main">
    <button class="btn-left btn_back">
      <svg class="icon-back">
        <use href="../icon/sprite.svg#back"></use>
      </svg>
    </button>
    <h2 class="title">Write Review</h2>
  </header>

  <div class="page-width spacing_top-2 spacing_bottom-2">
    <div class="review-product">
      <div class="review-product_img">
        <img src="../images/user/product/product19.png" alt="Vibrant Sunset Maxi Dress">
      </div>
      <div class="review-product_info">
        <p class="name">Vibrant Sunset Maxi Dress</p>
        <div class="meta">
          <span>Color: Gray</span>
          <span>Size: M</span>
        </div>
      </div>
    </div>

    <div class="rating-list">
      <div class="rating-row">
        <span class="label">Overall Rating</span>
        <div class="list-star">
          <svg class="icon-star active">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
          <svg class="icon-star active">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
          <svg class="icon-star active">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
          <svg class="icon-star active">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
          <svg class="icon-star active">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
        </div>
      </div>
      <div class="rating-row">
        <span class="label">Product Quality</span>
        <div class="list-star">
          <svg class="icon-star active">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
          <svg class="icon-star active">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
          <svg class="icon-star">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
          <svg class="icon-star">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
          <svg class="icon-star">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
        </div>
      </div>
      <div class="rating-row">
        <span class="label">Shipping Service</span>
        <div class="list-star">
          <svg class="icon-star active">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
          <svg class="icon-star active">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
          <svg class="icon-star">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
          <svg class="icon-star">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
          <svg class="icon-star">
            <use href="../icon/sprite.svg#star"></use>
          </svg>
        </div>
      </div>
    </div>

    <div class="review-feedback">
      <span class="label">Please write a feedback least 20 characters</span>
      <textarea placeholder="What do you think of the quality"></textarea>
    </div>

    <div class="review-anonymous">
      <input type="checkbox" class="check" id="anonymously">
      <label for="anonymously">Anonymously</label>
    </div>
  </div>

  <div class="menubar-button full">
    <button type="button" class="btn-dark" data-bs-toggle="modal" data-bs-target="#reviewSuccessModal">Review
      now</button>
  </div>

  <div class="modal fade" id="reviewSuccessModal">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <button type="button" class="modal-close" data-bs-dismiss="modal" aria-label="Close">
          <svg class="icon-close">
            <use href="../icon/sprite.svg#close"></use>
          </svg>
        </button>
        <div class="box-illustration">
          <svg class="icon-reviewCard" viewBox="0 0 36 36" fill="none">
            <rect x="3" y="6" width="30" height="24" rx="3" fill="rgb(var(--text-white))"
              stroke="rgb(var(--primary-base))" stroke-width="1.4" />
            <path d="M3 11.5H33" stroke="rgb(var(--primary-base))" stroke-width="1.4" />
            <circle cx="6.7" cy="8.7" r="0.9" fill="rgb(var(--primary-base))" />
            <circle cx="9.7" cy="8.7" r="0.9" fill="rgb(var(--primary-base))" />
            <use href="../icon/sprite.svg#star" x="5" y="15.5" width="5.5" height="5.5"
              style="color: rgb(var(--warning-base))"></use>
            <use href="../icon/sprite.svg#star" x="10.5" y="15.5" width="5.5" height="5.5"
              style="color: rgb(var(--warning-base))"></use>
            <use href="../icon/sprite.svg#star" x="16" y="15.5" width="5.5" height="5.5"
              style="color: rgb(var(--warning-base))"></use>
            <use href="../icon/sprite.svg#star" x="21.5" y="15.5" width="5.5" height="5.5"
              style="color: rgb(var(--warning-base))"></use>
            <use href="../icon/sprite.svg#star" x="27" y="15.5" width="5.5" height="5.5"
              style="color: rgb(var(--warning-base))"></use>
            <path d="M8 24.5H28" stroke="rgb(var(--state-200))" stroke-width="1.4" stroke-linecap="round" />
          </svg>
          <svg class="icon-badgeCheck">
            <use href="../icon/sprite.svg#badgeCheck"></use>
          </svg>
        </div>
        <div>
          <h5 class="mb12">Successful Review Completed</h5>
          <p>All objectives were met and expectations exceeded.</p>
        </div>
        <button type="button" class="btn-dark" data-bs-dismiss="modal">That's Nice</button>
      </div>
    </div>
  </div>

  <script type="text/javascript" src="../js/bootstrap.min.js"></script>
  <script type="text/javascript" src="../js/jquery.min.js"></script>
  <script type="text/javascript" src="../js/lazysize.min.js"></script>
  <script type="text/javascript" src="../js/swiper-bundle.min.js"></script>
  <script type="text/javascript" src="../js/carousel.js"></script>
  <script type="text/javascript" src="../js/jquery.nice-select.min.js"></script>
  <script type="text/javascript" src="../js/count-down.js"></script>
  <script type="text/javascript" src="../js/multiple-modal.js"></script>
  <script type="text/javascript" src="../js/nouislider.min.js"></script>
  <script type="text/javascript" src="../js/rangle-slider.js"></script>
  <script type="text/javascript" src="../js/init.js"></script>
  <script type="text/javascript" src="../js/main.js"></script>

</body>

</html>
