<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Jobko - Job Finder Mobile App</title>
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover">
  <!-- font -->
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="../css/nouislider.min.css" />
  <link rel="stylesheet" href="../css/swiper-bundle.min.css">
  <link rel="stylesheet" type="text/css" href="../css/styles.css" />
  <!-- manifest json -->
  <link rel="manifest" href="../_manifest.json" data-pwa-version="set_in_manifest_and_pwa_js">
  <!-- Favicon and Touch Icons  -->
  <link rel="shortcut icon" href="../images/logo/168.png" />
  <link rel="apple-touch-icon-precomposed" href="../images/logo/168.png" />

</head>

<body>

  <header class="header-main">
    <button class="btn-left btn_back">
      <svg class="icon-back">
        <use href="../icon/sprite.svg#back"></use>
      </svg>
    </button>
    <h2 class="title">Password Change</h2>
    <a href="home.html" class="btn-right">
      <svg class="icon-home icon">
        <use href="../icon/sprite.svg#home"></use>
      </svg>
    </a>
  </header>

  <div class="page-width main-page_change--pass spacing_top spacing_bottom-2">
    <div class="icon"><img src="../images/icon/lock.png" alt=""></div>
    <fieldset class="field mb20">
      <label for="currentPass" class="text-body-3 mb10">Current Password</label>
      <div class="password-wrap">
        <input type="password" id="currentPass" class="password-field" placeholder="Enter password" value="123456">
        <button type="button" class="show-pass">
            <svg class="icon">
                <use href="../icon/sprite.svg#eyeOff"></use>
            </svg>
        </button>
      </div>
    </fieldset>
    <fieldset class="field mb14">
      <label for="newPass" class="text-body-3 mb10">New Password</label>
      <div class="password-wrap">
        <input type="password" id="newPass" class="password-field" placeholder="Enter password" value="123456">
        <button type="button" class="show-pass">
            <svg class="icon">
                <use href="../icon/sprite.svg#eyeOff"></use>
            </svg>
        </button>
      </div>
    </fieldset>
        <fieldset class="field">
      <label for="confirmPass" class="text-body-3 mb10">Confirmed New Password</label>
      <div class="password-wrap">
        <input type="password" id="confirmPass" class="password-field" placeholder="Enter password" value="123456">
        <button type="button" class="show-pass">
            <svg class="icon">
                <use href="../icon/sprite.svg#eyeOff"></use>
            </svg>
        </button>
      </div>
    </fieldset>

  </div>

  <div class="menubar-button full">
    <a href="#updatePass" data-bs-toggle="modal" class="btn-dark">Update</a>
  </div>


  <div class="modal fade" id="updatePass">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <img class="icon" src="../images/icon/lock.png" alt="">
        <div>
          <h5 class="mb12">Password Updated Successfully</h5>
          <p>Your password has been changed. You can now use your new password the next time you log in.</p>
        </div>
        <button type="button" class="btn-dark" data-bs-dismiss="modal">Continue to Login</button>
    </div>
  </div>
</div>
 
  <script type="text/javascript" src="../js/bootstrap.min.js"></script>
  <script type="text/javascript" src="../js/jquery.min.js"></script>
  <script type="text/javascript" src="../js/lazysize.min.js"></script>
  <script type="text/javascript" src="../js/swiper-bundle.min.js"></script>
  <script type="text/javascript" src="../js/carousel.js"></script>
  <script type="text/javascript" src="../js/jquery.nice-select.min.js"></script>
  <script type="text/javascript" src="../js/count-down.js"></script>
  <script type="text/javascript" src="../js/multiple-modal.js"></script>
  <script type="text/javascript" src="../js/nouislider.min.js"></script>
  <script type="text/javascript" src="../js/rangle-slider.js"></script>
  <script type="text/javascript" src="../js/init.js"></script>
  <script type="text/javascript" src="../js/main.js"></script>

</body>

</html>
