<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Jobko - Job Finder Mobile App</title>
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover">
  <!-- font -->
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="../css/nouislider.min.css" />
  <link rel="stylesheet" href="../css/swiper-bundle.min.css">
  <link rel="stylesheet" type="text/css" href="../css/styles.css" />
  <!-- manifest json -->
  <link rel="manifest" href="../_manifest.json" data-pwa-version="set_in_manifest_and_pwa_js">
  <!-- Favicon and Touch Icons  -->
  <link rel="shortcut icon" href="../images/logo/168.png" />
  <link rel="apple-touch-icon-precomposed" href="../images/logo/168.png" />

</head>

<body>

  <header class="header-main">
    <button class="btn-left btn_back">
      <svg class="icon-back">
        <use href="../icon/sprite.svg#back"></use>
      </svg>
    </button>
    <h2 class="title">Become Seller</h2>
    <a href="home.html" class="btn-right">
      <svg class="icon-home icon">
        <use href="../icon/sprite.svg#home"></use>
      </svg>
    </a>
  </header>

  <div class="page-width main-page_become--seller-2 spacing_top-2 spacing_bottom-2">
    <div class="box-seller_step">
      <div class="step-item active">
        <span class="step">
          <svg class="icon-check" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 8.5L6.2 11.5L13 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </span>
        <div class="content">
          <span class="label">Step 1/3</span>
          <div class="title">Information</div>
        </div>
      </div>
      <div class="step-item active current">
        <span class="step">2</span>
        <div class="content">
          <span class="label">Step 2/3</span>
          <div class="title">Document</div>
        </div>
      </div>
    </div>

    <div class="fieldset row-grid column-2">
      <fieldset>
        <label for="documentType" class="label">Document Type</label>
        <div class="select-wrap">
          <select id="documentType" class="select">
            <option>Passport</option>
            <option>National ID</option>
            <option>Driver License</option>
          </select>
          <svg class="icon-arrowDown">
            <use href="../icon/sprite.svg#arrowDown"></use>
          </svg>
        </div>
      </fieldset>
      <fieldset>
        <label for="documentNumber" class="label">Document Number</label>
        <input type="text" id="documentNumber" value="A04880444">
      </fieldset>
    </div>

    <div class="fieldset row-grid column-2">
      <fieldset>
        <label for="issueDate" class="label">Issue Date</label>
        <input type="text" id="issueDate" value="12 March 2023">
      </fieldset>
      <fieldset>
        <label for="expireDate" class="label">Expire Date</label>
        <input type="text" id="expireDate" value="13 March 2025">
      </fieldset>
    </div>

    <fieldset class="fieldset">
      <label class="label text-upload">Upload Document <span>(JPEG, PDF &amp; PNG Max. 10MB)</span></label>
      <div class="upload-box">
        <input type="file" class="ip-file">
        <svg class="icon-imgUpload"><use href="../icon/sprite.svg#imgUpload"></use></svg>
        <a href="#" class="btn-choose">Choose File</a>
      </div>
      <div class="file-preview">
        <div class="thumb">
          <img src="../images/user/passport.png" alt="Passport.jpg">
        </div>
        <div class="info">
          <span class="name">Passport.jpg</span>
          <span class="size">2.4 mb</span>
        </div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle opacity="0.8" cx="12" cy="4" r="2" fill="#006AFF"/>
          <circle opacity="0.3" cx="12" cy="20" r="2" fill="#006AFF"/>
          <circle cx="18.9281" cy="7.99963" r="2" transform="rotate(60 18.9281 7.99963)" fill="#006AFF"/>
          <circle opacity="0.4" cx="5.07166" cy="15.9996" r="2" transform="rotate(60 5.07166 15.9996)" fill="#006AFF"/>
          <circle opacity="0.3" cx="18.9281" cy="15.9996" r="2" transform="rotate(120 18.9281 15.9996)" fill="#006AFF"/>
          <circle opacity="0.6" cx="5.07166" cy="7.99963" r="2" transform="rotate(120 5.07166 7.99963)" fill="#006AFF"/>
        </svg>

      </div>
    </fieldset>

    <fieldset class="fieldset">
      <label class="label">Company Logo</label>
      <div class="upload-box">
        <input type="file" class="ip-file">
        <svg class="icon-imgUpload"><use href="../icon/sprite.svg#imgUpload"></use></svg>
        <a href="#" class="btn-choose">Choose File</a>
      </div>
    </fieldset>

    <fieldset class="fieldset">
      <label for="shortNote" class="label">Short Note</label>
      <input type="text" id="shortNote" placeholder="Check my documents"></input>
    </fieldset>

    <div class="checkbox">
      <input type="checkbox" class="check" id="agreeSeller" checked>
      <label for="agreeSeller" class="text-caption-1">I agree all terms and condition in ShopO</label>
    </div>
  </div>

  <div class="menubar-button">
    <a href="become-seller.html" class="btn-line">Previous</a>
    <a href="become-seller.html" class="btn-primary">Submit</a>
  </div>

  <script type="text/javascript" src="../js/bootstrap.min.js"></script>
  <script type="text/javascript" src="../js/jquery.min.js"></script>
  <script type="text/javascript" src="../js/lazysize.min.js"></script>
  <script type="text/javascript" src="../js/swiper-bundle.min.js"></script>
  <script type="text/javascript" src="../js/carousel.js"></script>
  <script type="text/javascript" src="../js/jquery.nice-select.min.js"></script>
  <script type="text/javascript" src="../js/count-down.js"></script>
  <script type="text/javascript" src="../js/multiple-modal.js"></script>
  <script type="text/javascript" src="../js/nouislider.min.js"></script>
  <script type="text/javascript" src="../js/rangle-slider.js"></script>
  <script type="text/javascript" src="../js/init.js"></script>
  <script type="text/javascript" src="../js/main.js"></script>

</body>

</html>
